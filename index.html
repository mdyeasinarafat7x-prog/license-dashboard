<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Key Dashboard • Admin Panel</title>
<style>
:root{--bg:#07091d;--panel:#0d1230;--panel2:#111638;--line:#39206e;--purple:#8b24ff;--purple2:#c15dff;--text:#f5f0ff;--muted:#a9a2d2;--green:#36e0a0;--red:#ff6689}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 0%,#17133d 0,#08091d 55%,#050617 100%);color:var(--text);font:15px/1.45 system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}button,input,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}.login-wrap{min-height:100vh;display:grid;place-items:center;padding:22px}.login-card{width:min(100%,440px);padding:32px;border:1px solid #7138bc;border-radius:26px;background:#0d1230eF;box-shadow:0 0 50px #711cff24;position:relative}.login-card:before{content:'';position:absolute;inset:8px;border:1px solid #6333a45c;border-radius:20px;pointer-events:none}.brand-icon{width:58px;height:58px;border-radius:18px;background:linear-gradient(135deg,#7620fa,#d46bff);display:grid;place-items:center;font-size:28px;box-shadow:0 0 24px #9d36ff50}.login-card h1{font-size:27px;letter-spacing:2px;color:#c68bff;margin:20px 0 25px}.field{display:grid;gap:7px;margin:14px 0;color:var(--muted)}input,select{width:100%;min-width:0;padding:13px 14px;border:1px solid #3c2b66;border-radius:12px;background:#0a0d25;color:var(--text);outline:none}input:focus,select:focus{border-color:#a34bff;box-shadow:0 0 0 3px #8c31ff20}.btn{border:0;border-radius:12px;padding:12px 16px;color:white;background:linear-gradient(110deg,#7a19f7,#c45cff);font-weight:700;box-shadow:0 6px 18px #851cff26}.btn:hover{filter:brightness(1.08)}.btn.secondary{background:#171632;border:1px solid #4b2b77;box-shadow:none}.btn.danger{background:#47172d;border:1px solid #8c3152;box-shadow:none}.btn.small{padding:7px 10px;font-size:12px}.full{width:100%}.hint{color:#8e88b8;font-size:12px;margin-top:18px}.app{min-height:100vh}.topbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:13px;padding:13px 20px;border-bottom:1px solid #42216c;background:#08091ef2;backdrop-filter:blur(12px)}.brand{display:flex;align-items:center;gap:12px;min-width:0;font-size:20px;font-weight:700;flex:1}.brand .brand-icon{width:48px;height:48px;font-size:23px}.wallet{color:var(--green);border:1px solid #1c6b56;background:#092a2a;border-radius:99px;padding:9px 14px;font-weight:700;white-space:nowrap}.layout{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:calc(100vh - 75px)}.sidebar{padding:18px 12px;border-right:1px solid #321c5b;background:#080a20}.nav{display:grid;gap:7px}.nav button{display:flex;gap:12px;align-items:center;text-align:left;color:#c9bde9;background:transparent;border:1px solid transparent;border-radius:12px;padding:12px}.nav button.active,.nav button:hover{background:linear-gradient(110deg,#7417f0,#a538ff);color:white;box-shadow:0 0 18px #8d27ff25}.nav .ico{font-size:19px;width:24px;text-align:center}.main{padding:26px;min-width:0;max-width:1400px;width:100%;margin:0 auto}.page-head{display:flex;justify-content:space-between;gap:14px;align-items:center;margin-bottom:20px}.page-head h1{margin:0;font-size:clamp(24px,3vw,34px);color:#d2a0ff}.sub{color:var(--muted);margin-top:4px}.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}.card{grid-column:span 12;border:1px solid #51268a;border-radius:20px;padding:20px;background:linear-gradient(140deg,#101432f5,#0b0d25f5);box-shadow:0 10px 35px #0002;min-width:0}.card h2{font-size:19px;margin:0 0 16px;color:#c58cff}.card.half{grid-column:span 6}.card.third{grid-column:span 4}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}.stat{padding:17px;border:1px solid #392264;border-radius:16px;background:#0d102a}.stat span{display:block;color:var(--muted);font-size:12px}.stat strong{display:block;font-size:25px;margin-top:6px;overflow-wrap:anywhere}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:540px}th,td{padding:12px 10px;border-bottom:1px solid #292147;text-align:left;vertical-align:middle}th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:#a997d4}td{overflow-wrap:anywhere}.pill{display:inline-flex;border-radius:99px;padding:4px 9px;background:#231443;color:#d9baff;font-size:12px}.pill.green{background:#0d322b;color:#5cf0b3}.pill.red{background:#3a1727;color:#ff9db7}.empty{padding:26px;text-align:center;border:1px dashed #4e2b7a;border-radius:14px;color:var(--muted)}.notice{padding:12px 14px;border-radius:12px;border:1px solid #5b3888;background:#17102e;color:#d9c6f6;margin-bottom:16px;font-size:13px}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#1c1538;border:1px solid #8c43c8;padding:12px 18px;border-radius:12px;z-index:20;box-shadow:0 8px 30px #0008;max-width:90vw}.menu-btn{display:none}.footer{text-align:center;color:#7753ac;padding:28px 0 8px}.balance-text{color:var(--green);font-weight:700}.row2{display:flex;gap:10px;align-items:center}.row2>*{flex:1}
@media(max-width:850px){.layout{grid-template-columns:1fr}.sidebar{display:none;border-right:0;border-bottom:1px solid #321c5b;padding:10px}.sidebar.open{display:block}.nav{grid-template-columns:repeat(2,minmax(0,1fr))}.main{padding:16px}.card.half,.card.third{grid-column:span 12}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.menu-btn{display:inline-block}.topbar{padding:10px 12px}.brand{font-size:17px}.brand .brand-icon{width:42px;height:42px}.wallet{padding:8px 10px;font-size:13px}.topbar .logout{padding:9px 10px;font-size:12px}}@media(max-width:440px){.form-grid{grid-template-columns:1fr}.login-card{padding:25px 20px}.page-head{align-items:flex-start;flex-direction:column}.nav{grid-template-columns:1fr 1fr}.nav button{padding:10px 8px;font-size:13px}.stat strong{font-size:21px}}
</style></head>
<body>
<div id="loginScreen" class="login-wrap"><form id="loginForm" class="login-card"><div class="brand-icon">♛</div><h1>KEY DASHBOARD</h1><div class="field">Username<input id="loginName" autocomplete="username" placeholder="Enter username" required></div><div class="field">Password<input id="loginPass" type="password" autocomplete="current-password" placeholder="Enter password" required></div><button class="btn full" type="submit">Sign In　➜</button><div class="hint">Dashboard 2026 · Local demo prototype</div><div class="hint"><b>Demo logins</b><br>Main Admin: <code>mainadmin</code> / <code>Demo@12345</code><br>Admin Panel: <code>paneladmin</code> / <code>Demo@12345</code><br>Reseller: <code>reseller1</code> / <code>Demo@12345</code></div></form></div>
<div id="app" class="app hidden"><header class="topbar"><div class="brand"><div class="brand-icon">♛</div><span id="brandTitle">Admin Panel</span></div><div class="wallet">▣ <span id="topBalance">$59.45</span></div><button class="btn secondary menu-btn" id="menuBtn" aria-label="Toggle menu">☰</button><button class="btn secondary logout" id="logoutBtn">Log out</button></header><div class="layout"><aside class="sidebar" id="sidebar"><nav class="nav" id="nav"></nav></aside><main class="main"><div id="content"></div><div class="footer">—　Dashboard 2026　—</div></main></div></div><div id="toast" class="toast hidden"></div>
<script>
const $=s=>document.querySelector(s);const money=n=>'$'+Number(n||0).toFixed(2);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const defaultState={panels:[{id:1,name:'AlphaRegedit iOS',prices:{'1 Hour':.10,'3 Hours':.25,'6 Hours':.40,'12 Hours':.70,'1 Day':.15,'3 Days':2.20,'7 Days':4,'30 Days':9}},{id:2,name:'ZenReg External IOS',prices:{'1 Hour':.10,'3 Hours':.25,'6 Hours':.40,'12 Hours':.70,'1 Day':.15,'3 Days':2.20,'7 Days':4,'30 Days':9}},{id:3,name:'PHANTOM MOD ANDROID+IOS',prices:{'1 Hour':.10,'3 Hours':.25,'6 Hours':.40,'12 Hours':.70,'1 Day':.15,'3 Days':2.20,'7 Days':4,'30 Days':9}},{id:4,name:'ST MOD ROOT',prices:{'1 Hour':.10,'3 Hours':.25,'6 Hours':.40,'12 Hours':.70,'1 Day':.15,'3 Days':2.20,'7 Days':4,'30 Days':9}},{id:5,name:'XYZ CHEATS APKMOD',prices:{'1 Hour':.10,'3 Hours':.25,'6 Hours':.40,'12 Hours':.70,'1 Day':.15,'3 Days':2.20,'7 Days':4,'30 Days':9}}],users:[{id:1,username:'mainadmin',name:'Main Admin',role:'main',password:'Demo@12345',balance:59.45,active:true,created:'2026-10-25'},{id:2,username:'paneladmin',name:'Admin Panel',role:'panel',password:'Demo@12345',balance:0.15,active:true,created:'2026-10-25'},{id:3,username:'reseller1',name:'Reseller Admin',role:'reseller',password:'Demo@12345',balance:0.15,active:true,created:'2026-10-25'}],keys:[],transactions:[],logs:[],nextUser:4,nextPanel:6,nextKey:1};let state;try{state=JSON.parse(localStorage.getItem('keyDashDemo'))||structuredClone(defaultState)}catch(e){state=JSON.parse(JSON.stringify(defaultState))}let current=null,active='dashboard',toastTimer;
function save(){localStorage.setItem('keyDashDemo',JSON.stringify(state))}function say(m){$('#toast').textContent=m;$('#toast').classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').classList.add('hidden'),2600)}function log(action,detail=''){state.logs.unshift({date:new Date().toLocaleString(),by:current?.username||'system',action,detail});save()}function isMain(){return current?.role==='main'}function canManageUsers(){return current?.role==='main'||current?.role==='panel'}function visibleNav(){if(current?.role==='reseller')return [['generate','⚿','Key Generator']];let n=[['dashboard','▦','Dashboard'],['generate','⚿','Key Generator'],['history','☷','Key History'],['keyreset','↻','Key Reset'],['transactions','▣','Transactions']];if(isMain())n.push(['panels','▤','Manage Panels'],['users','♙','Manage Users'],['balance','＋','Add Balance'],['logs','◷','Audit Log'],['settings','⚙','Main Admin Control']);else if(current?.role==='panel')n.push(['users','♙','Reseller Admins']);return n}
function renderNav(){let nav=visibleNav();$('#nav').innerHTML=nav.map(([id,ico,label])=>`<button class="${active===id?'active':''}" data-page="${id}"><span class="ico">${ico}</span>${label}</button>`).join('');$('#nav').querySelectorAll('button').forEach(b=>b.onclick=()=>{active=b.dataset.page;$('#sidebar').classList.remove('open');render()})}
function render(){if(!current)return;$('#brandTitle').textContent=current.role==='main'?'Main Admin':current.role==='panel'?'Admin Panel':'Reseller Admin';$('#topBalance').textContent=money(current.balance);renderNav();let pages={dashboard:dashboardPage,generate:generatePage,history:historyPage,keyreset:keyResetPage,transactions:transactionsPage,panels:panelsPage,users:usersPage,balance:balancePage,logs:logsPage,settings:settingsPage};if(!pages[active]||((active==='panels'||active==='balance'||active==='logs'||active==='settings')&&!isMain())||(active==='users'&&!canManageUsers()))active='dashboard';renderNav();$('#content').innerHTML=pages[active]();wirePage()}
function head(title,sub=''){return `<div class="page-head"><div><h1>${title}</h1><div class="sub">${sub}</div></div></div>`}function dashboardPage(){let own=state.keys.filter(k=>k.createdBy===current.username);return `${head('Dashboard',`Welcome back, ${esc(current.name)}.`)}<div class="notice">Prototype mode: this page stores demo data in this browser only. It is not a secure, public multi-user service yet.</div><div class="stats"><div class="stat"><span>Your Balance</span><strong class="balance-text">${money(current.balance)}</strong></div><div class="stat"><span>Keys You Generated</span><strong>${own.length}</strong></div><div class="stat"><span>Available Panels</span><strong>${state.panels.length}</strong></div><div class="stat"><span>Your Role</span><strong style="font-size:18px">${esc(current.role==='main'?'Main Admin':current.role==='panel'?'Admin Panel':'Reseller Admin')}</strong></div></div><div class="grid"><section class="card half"><h2>Quick Actions</h2><div class="actions"><button class="btn" data-go="generate">⚿ Generate Keys</button>${isMain()?'<button class="btn secondary" data-go="panels">Manage Panels</button><button class="btn secondary" data-go="balance">Add Balance</button>':''}${canManageUsers()?'<button class="btn secondary" data-go="users">Manage Users</button>':''}</div></section><section class="card half"><h2>Recent Activity</h2>${state.logs.slice(0,4).map(l=>`<p><span class="pill">${esc(l.action)}</span> ${esc(l.detail)}<div class="sub">${esc(l.date)}</div></p>`).join('')||'<div class="empty">No activity yet</div>'}</section></div>`}
const validities=['1 Hour','3 Hours','6 Hours','12 Hours','1 Day','3 Days','7 Days','30 Days'];function generatePage(){return `${head('Key Generator','Generate keys for your permitted products')}<section class="card"><div class="form-grid"><label class="field">Product Type<select id="keyPanel">${state.panels.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></label><label class="field">Validity<select id="keyValidity">${validities.map(v=>`<option>${v}</option>`).join('')}</select></label><label class="field">Quantity<input id="keyQty" type="number" min="1" max="100" value="1"></label><label class="field">Price per key<input id="keyPrice" readonly value="${money(state.panels[0]?.prices['1 Day']||0)}"></label></div><div class="actions"><button class="btn full" id="generateBtn">⚡ Generate Keys　➜</button></div></section><section class="card" style="margin-top:16px"><h2>Generated Keys</h2><div id="generatedPreview" class="empty">Your generated keys will appear here.</div></section>`}
function keyResetPage(){return `${head('Key Reset','Paste your license key below to clear its saved device activation')}<section class="card" style="max-width:680px;margin:0 auto"><div style="text-align:center;padding:18px 8px 8px"><div style="font-size:48px;color:var(--purple2);margin-bottom:8px">↻</div><h2 style="margin:0 0 8px">Reset Device</h2><p class="muted">Paste the exact key you want to use on another device.</p></div><div class="field" style="margin-top:24px"><label for="resetKeyInput">License Key</label><input id="resetKeyInput" autocomplete="off" spellcheck="false" placeholder="Paste your license key here..." style="width:100%;padding:16px;border-radius:14px" /></div><button class="btn danger" id="resetPastedKeyBtn" style="width:100%;padding:15px;font-size:16px">↻ Key Reset</button><div class="muted" style="margin-top:14px;text-align:center;font-size:13px">The key itself stays the same. Only its saved device/HWID binding is cleared.</div><div id="resetKeyMessage" style="margin-top:14px"></div><div class="notice" style="margin-top:20px">Prototype mode: this clears the device binding saved in this browser only. A connected license server/backend is required for a real reset across devices.</div></section>`}
function historyPage(){let list=state.keys.filter(k=>isMain()||k.createdBy===current.username);return `${head('Key History','Review generated key records and reset device activation')}<section class="card"><div class="notice">HWID / Device Reset keeps the same license key and clears its saved device binding. In this prototype it only updates local demo data; real device reset requires the license server/backend.</div><div class="table-wrap"><table><thead><tr><th>Key</th><th>Panel</th><th>Validity</th><th>Price</th><th>Device / HWID</th><th>Created By</th><th>Date</th><th>Action</th></tr></thead><tbody>${list.map(k=>`<tr><td><code>${esc(k.key)}</code> <button class="btn small secondary" data-copy="${esc(k.key)}">Copy</button></td><td>${esc(k.panel)}</td><td>${esc(k.validity)}</td><td>${money(k.price)}</td><td><code>${esc(k.hwid||'Not bound')}</code></td><td>${esc(k.createdBy)}</td><td>${esc(k.date)}</td><td><button class="btn small danger" data-reset-hwid="${k.id}">Reset HWID</button></td></tr>`).join('')||'<tr><td colspan="8"><div class="empty">No keys generated yet</div></td></tr>'}</tbody></table></div></section>`}
function transactionsPage(){let list=state.transactions.filter(t=>isMain()||t.username===current.username);return `${head('Transactions','Balance changes and key purchases')}<section class="card"><div class="table-wrap"><table><thead><tr><th>Date</th><th>User</th><th>Type</th><th>Amount</th><th>Note</th></tr></thead><tbody>${list.map(t=>`<tr><td>${esc(t.date)}</td><td>${esc(t.username)}</td><td>${esc(t.type)}</td><td class="${t.amount>=0?'balance-text':''}">${t.amount>=0?'+':''}${money(t.amount)}</td><td>${esc(t.note)}</td></tr>`).join('')||'<tr><td colspan="5"><div class="empty">No transactions yet</div></td></tr>'}</tbody></table></div></section>`}
function panelsPage(){return `${head('Manage Panels','Add panels and set prices for every validity period')}<section class="card"><h2>Add New Panel</h2><div class="row2"><input id="newPanelName" placeholder="New panel name"><button class="btn" id="addPanelBtn">＋ Add Panel</button></div></section>${state.panels.map(p=>`<section class="card" style="margin-top:14px"><div class="row2"><h2 style="margin:0">${esc(p.name)}</h2><button class="btn danger small" data-delete-panel="${p.id}">Delete Panel</button></div><div class="form-grid" style="margin-top:14px"><label class="field">Panel Name<input id="pname-${p.id}" value="${esc(p.name)}"></label>${validities.map(v=>`<label class="field">${v} Price ($)<input type="number" min="0" step="0.01" id="price-${p.id}-${v}" value="${Number(p.prices[v]??0).toFixed(2)}"></label>`).join('')}</div><div class="actions"><button class="btn" data-save-panel="${p.id}">Save Panel & Prices</button></div></section>`).join('')}`}
function usersPage(){let users=state.users.filter(u=>isMain()?u.role!=='main':u.role==='reseller'&&u.createdBy===current.username);return `${head(isMain()?'Manage Users':'Reseller Admins',isMain()?'Create accounts, change roles, or disable access':'Create Reseller Admin accounts for key generation')}<section class="card"><h2>Add User</h2><form id="addUserForm"><div class="form-grid"><label class="field">Display Name<input id="newUserName" required placeholder="e.g. Rahim Store"></label><label class="field">Username<input id="newUsername" required minlength="3" placeholder="unique username"></label><label class="field">Temporary Password<input id="newPassword" required minlength="8" placeholder="At least 8 characters"></label><label class="field">Starting Balance ($)<input id="newUserBalance" type="number" min="0" step="0.01" value="0.00" required ${!isMain()?'readonly':''}></label>${isMain()?'<label class="field">Role<select id="newUserRole"><option value="panel">Admin Panel</option><option value="reseller">Reseller Admin</option></select></label>':''}</div><div class="actions"><button class="btn" type="submit">＋ Create User</button></div></form></section><section class="card" style="margin-top:16px"><h2>User Accounts</h2><div class="table-wrap"><table><thead><tr><th>Name / Username</th><th>Role</th><th>Balance</th><th>Status</th><th>Actions</th></tr></thead><tbody>${users.map(u=>`<tr><td><b>${esc(u.name)}</b><br><span class="sub">@${esc(u.username)}</span></td><td>${esc(u.role==='panel'?'Admin Panel':'Reseller Admin')}</td><td class="balance-text">${money(u.balance)}</td><td><span class="pill ${u.active?'green':'red'}">${u.active?'Active':'Disabled'}</span></td><td><button class="btn small secondary" data-toggle-user="${u.id}">${u.active?'Disable':'Enable'}</button>${isMain()?` <button class="btn small secondary" data-edit-balance="${u.id}">Balance</button> <button class="btn small danger" data-delete-user="${u.id}">Delete</button>`:''}</td></tr>`).join('')||'<tr><td colspan="5">No users yet</td></tr>'}</tbody></table></div></section>`}
function balancePage(){return `${head('Add Balance','Only Main Admin can change user balances')}<section class="card"><form id="balanceForm"><div class="form-grid"><label class="field">Select User<select id="balanceUser">${state.users.filter(u=>u.role!=='main').map(u=>`<option value="${u.id}">${esc(u.name)} (@${esc(u.username)}) — ${money(u.balance)}</option>`).join('')}</select></label><label class="field">Amount ($)<input id="balanceAmount" type="number" min="0.01" step="0.01" required placeholder="10.00"></label><label class="field">Action<select id="balanceAction"><option value="add">Add Balance</option><option value="subtract">Subtract Balance</option><option value="set">Set Exact Balance</option></select></label><label class="field">Note<input id="balanceNote" placeholder="Reason / reference"></label></div><div class="actions"><button class="btn" type="submit">Apply Balance Change</button></div></form></section><section class="card" style="margin-top:16px"><h2>Current Balances</h2><div class="table-wrap"><table><thead><tr><th>User</th><th>Role</th><th>Balance</th></tr></thead><tbody>${state.users.filter(u=>u.role!=='main').map(u=>`<tr><td>${esc(u.name)} (@${esc(u.username)})</td><td>${esc(u.role)}</td><td class="balance-text">${money(u.balance)}</td></tr>`).join('')}</tbody></table></div></section>`}
function logsPage(){return `${head('Audit Log','Track admin actions for accountability')}<section class="card"><div class="table-wrap"><table><thead><tr><th>Date</th><th>Account</th><th>Action</th><th>Details</th></tr></thead><tbody>${state.logs.map(l=>`<tr><td>${esc(l.date)}</td><td>${esc(l.by)}</td><td>${esc(l.action)}</td><td>${esc(l.detail)}</td></tr>`).join('')||'<tr><td colspan="4">No audit events yet</td></tr>'}</tbody></table></div></section>`}
function settingsPage(){return `${head('Main Admin Control','Administrative overview and local demo controls')}<section class="card"><h2>System Overview</h2><div class="stats"><div class="stat"><span>Total Users</span><strong>${state.users.length}</strong></div><div class="stat"><span>Panels</span><strong>${state.panels.length}</strong></div><div class="stat"><span>Keys Generated</span><strong>${state.keys.length}</strong></div><div class="stat"><span>Transactions</span><strong>${state.transactions.length}</strong></div></div><div class="notice">For real security, this must be connected to a server-side database and authentication system. Browser storage can be edited by the device owner and does not sync between users.</div><div class="actions"><button class="btn secondary" id="exportBtn">Export Demo Data (JSON)</button><button class="btn danger" id="resetDemoBtn">Reset Demo Data</button></div></section>`}
function wirePage(){let panelSel=$('#keyPanel'),validSel=$('#keyValidity');
 $('#resetPastedKeyBtn')?.addEventListener('click',()=>{let input=$('#resetKeyInput');let message=$('#resetKeyMessage');let pasted=(input?.value||'').trim();if(!pasted){message.innerHTML='<div class="notice">Please paste a license key first.</div>';return}let k=state.keys.find(x=>String(x.key).trim().toLowerCase()===pasted.toLowerCase()&&(isMain()||x.createdBy===current.username));if(!k){message.innerHTML='<div class="notice">Key not found in this demo account.</div>';return}if(!confirm('Reset this key device binding? The key will remain unchanged.'))return;let previous=k.hwid||'';k.hwid='';log('Key Reset',`${k.key} · previous device: ${previous||'not recorded'}`);save();message.innerHTML='<div class="notice">Key reset in demo. The license key has not changed.</div>';input.value='';say('Key reset in demo. License key unchanged.')});$('#content').querySelectorAll('[data-reset-hwid]').forEach(b=>b.onclick=()=>{let k=state.keys.find(x=>x.id===Number(b.dataset.resetHwid));if(!k)return;if(!confirm('Reset this key’s HWID/device activation? The license key will remain unchanged.'))return;let previous=k.hwid||'';k.hwid='';log('HWID / Device Reset',`${k.key} · previous device: ${previous||'not recorded'}`);save();render();say('Device activation reset in demo. Key unchanged.')});function priceUpdate(){let p=state.panels.find(x=>x.id===Number(panelSel?.value));if($('#keyPrice'))$('#keyPrice').value=money(p?.prices[validSel?.value]||0)}if(panelSel)panelSel.onchange=priceUpdate;if(validSel)validSel.onchange=priceUpdate;
$('#generateBtn')?.addEventListener('click',()=>{let p=state.panels.find(x=>x.id===Number($('#keyPanel').value)),v=$('#keyValidity').value,q=Number($('#keyQty').value),price=Number(p?.prices[v]||0);if(!p||!Number.isInteger(q)||q<1||q>100)return say('Quantity must be between 1 and 100.');let total=price*q;if(current.balance<total)return say('Insufficient balance. Ask Main Admin to add balance.');current.balance=Number((current.balance-total).toFixed(2));let made=[];for(let i=0;i<q;i++){let key='KD-'+cryptoRandom()+'-'+cryptoRandom();let record={id:state.nextKey++,key,panel:p.name,panelId:p.id,validity:v,price,createdBy:current.username,date:new Date().toLocaleString(),hwid:''};state.keys.unshift(record);made.push(record)}state.transactions.unshift({date:new Date().toLocaleString(),username:current.username,type:'Key purchase',amount:-total,note:`${q} key(s) · ${p.name} · ${v}`});log('Generate Keys',`${q} × ${p.name} / ${v}`);save();$('#topBalance').textContent=money(current.balance);$('#generatedPreview').className='';$('#generatedPreview').innerHTML=`<div class="notice">Generated ${q} key(s). Total cost: <b>${money(total)}</b></div>${made.map(k=>`<p><code>${esc(k.key)}</code> <button class="btn small secondary" data-copy="${esc(k.key)}">Copy</button></p>`).join('')}`;wireCopy();say('Demo keys generated.')});
$('#addPanelBtn')?.addEventListener('click',()=>{let name=$('#newPanelName').value.trim();if(!name)return say('Enter a panel name.');if(state.panels.some(p=>p.name.toLowerCase()===name.toLowerCase()))return say('Panel name already exists.');let prices={};validities.forEach(v=>prices[v]=({ '1 Hour':.10,'3 Hours':.25,'6 Hours':.40,'12 Hours':.70,'1 Day':.15,'3 Days':2.20,'7 Days':4,'30 Days':9})[v]);state.panels.push({id:state.nextPanel++,name,prices});log('Add Panel',name);save();render();say('Panel added.')});
$('#content').querySelectorAll('[data-save-panel]').forEach(b=>b.onclick=()=>{let p=state.panels.find(p=>p.id===Number(b.dataset.savePanel));if(!p)return;p.name=$('#pname-'+p.id).value.trim()||p.name;validities.forEach(v=>p.prices[v]=Math.max(0,Number($('#price-'+p.id+'-'+v).value)||0));log('Update Panel',p.name+' prices updated');save();render();say('Panel and prices saved.')});
$('#content').querySelectorAll('[data-delete-panel]').forEach(b=>b.onclick=()=>{let p=state.panels.find(p=>p.id===Number(b.dataset.deletePanel));if(p&&confirm('Delete panel '+p.name+'?')){state.panels=state.panels.filter(x=>x.id!==p.id);log('Delete Panel',p.name);save();render();say('Panel deleted.')}});
$('#addUserForm')?.addEventListener('submit',e=>{e.preventDefault();let username=$('#newUsername').value.trim().toLowerCase(),password=$('#newPassword').value,name=$('#newUserName').value.trim(),role=isMain()?$('#newUserRole').value:'reseller',balance=isMain()?Number($('#newUserBalance').value)||0:0;if(state.users.some(u=>u.username===username))return say('Username already exists.');if(!/^[a-z0-9_.-]{3,30}$/.test(username))return say('Username: use 3–30 letters, numbers, . _ or -.');if(password.length<8)return say('Password must be at least 8 characters.');let u={id:state.nextUser++,username,password,name,role,balance,active:true,created:new Date().toISOString().slice(0,10),createdBy:current.username};state.users.push(u);if(balance>0)state.transactions.unshift({date:new Date().toLocaleString(),username,type:'Initial balance',amount:balance,note:'Account created by '+current.username});log('Add User',`${username} (${role})`);save();render();say('User created.')});
$('#content').querySelectorAll('[data-toggle-user]').forEach(b=>b.onclick=()=>{let u=state.users.find(x=>x.id===Number(b.dataset.toggleUser));if(u){u.active=!u.active;log(u.active?'Enable User':'Disable User',u.username);save();render()}});$('#content').querySelectorAll('[data-delete-user]').forEach(b=>b.onclick=()=>{let u=state.users.find(x=>x.id===Number(b.dataset.deleteUser));if(u&&confirm('Delete '+u.username+'?')){state.users=state.users.filter(x=>x.id!==u.id);log('Delete User',u.username);save();render()}});$('#content').querySelectorAll('[data-edit-balance]').forEach(b=>b.onclick=()=>{let u=state.users.find(x=>x.id===Number(b.dataset.editBalance));if(!u)return;let n=prompt('Set balance for '+u.username,Number(u.balance).toFixed(2));if(n===null||!Number.isFinite(Number(n))||Number(n)<0)return say('Invalid balance.');let amt=Number(n),delta=amt-u.balance;u.balance=amt;state.transactions.unshift({date:new Date().toLocaleString(),username:u.username,type:'Admin balance adjustment',amount:delta,note:'Adjusted by '+current.username});log('Adjust Balance',`${u.username}: ${money(amt)}`);save();render()});
$('#balanceForm')?.addEventListener('submit',e=>{e.preventDefault();let u=state.users.find(x=>x.id===Number($('#balanceUser').value)),amt=Number($('#balanceAmount').value),action=$('#balanceAction').value;if(!u||!Number.isFinite(amt)||amt<=0)return say('Enter a valid amount.');let old=u.balance;if(action==='add')u.balance+=amt;else if(action==='subtract'){if(u.balance<amt)return say('User does not have enough balance.');u.balance-=amt}else u.balance=amt;u.balance=Number(u.balance.toFixed(2));let delta=u.balance-old;state.transactions.unshift({date:new Date().toLocaleString(),username:u.username,type:action==='add'?'Balance added':action==='subtract'?'Balance deducted':'Balance set',amount:delta,note:$('#balanceNote').value||'Main Admin adjustment'});log('Balance Change',`${u.username}: ${money(old)} → ${money(u.balance)}`);save();render();say('Balance updated.')});
$('#exportBtn')?.addEventListener('click',()=>{let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='key-dashboard-demo-backup.json';a.click();URL.revokeObjectURL(url)});$('#resetDemoBtn')?.addEventListener('click',()=>{if(confirm('Reset all local demo data? This cannot be undone.')){state=JSON.parse(JSON.stringify(defaultState));save();current=state.users[0];active='dashboard';log('Reset Demo','Demo data reset');render();say('Demo data reset.')}});wireCopy()}
function wireCopy(){$('#content').querySelectorAll('[data-copy]').forEach(b=>b.onclick=async()=>{try{await navigator.clipboard.writeText(b.dataset.copy);say('Copied key.')}catch(e){say(b.dataset.copy)}})}function cryptoRandom(){let a=new Uint8Array(5);crypto.getRandomValues(a);return [...a].map(x=>x.toString(16).padStart(2,'0')).join('').toUpperCase()}
$('#loginForm').addEventListener('submit',e=>{e.preventDefault();let u=state.users.find(x=>x.username===$('#loginName').value.trim().toLowerCase()&&x.password===$('#loginPass').value);if(!u||!u.active)return say('Invalid login or account disabled.');current=u;active=u.role==='reseller'?'generate':'dashboard';$('#loginScreen').classList.add('hidden');$('#app').classList.remove('hidden');log('Login','Signed in');render()});$('#logoutBtn').onclick=()=>{current=null;$('#app').classList.add('hidden');$('#loginScreen').classList.remove('hidden');$('#loginPass').value=''};$('#menuBtn').onclick=()=>$('#sidebar').classList.toggle('open');$('#content').addEventListener('click',e=>{let b=e.target.closest('[data-go]');if(b){active=b.dataset.go;render()}});
</script></body></html>
